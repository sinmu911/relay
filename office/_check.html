<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비서실 레이아웃 확인(임시)</title>
<meta name="robots" content="noindex,nofollow">
<style>
  html,body{margin:0;height:100%;background:#e6e1d8;font-family:system-ui,sans-serif;overflow:hidden}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start}
  .box{background:#fff;border:1px solid #ccc;border-radius:6px;overflow:hidden}
  .cap{font-size:11px;color:#333;padding:2px 4px;background:#fff;border-bottom:1px solid #ddd}
  .vp{position:relative;overflow:hidden}
  iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const SIZES = [
    {w:1920, h:1080, s:0.42},
    {w:1366, h:768, s:0.62},
    {w:1366, h:700, s:0.62},
    {w:390, h:844, s:0.9}
  ];
  const row = document.getElementById("row");
  SIZES.forEach((z, i) => {
    const box = document.createElement("div");
    box.className = "box";
    box.style.width = Math.round(z.w * z.s) + "px";
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = z.w + " × " + z.h;
    const vp = document.createElement("div");
    vp.className = "vp";
    vp.style.width = Math.round(z.w * z.s) + "px";
    vp.style.height = Math.round(z.h * z.s) + "px";
    const f = document.createElement("iframe");
    f.id = "f" + i;
    f.width = z.w;
    f.height = z.h;
    f.style.transform = "scale(" + z.s + ")";
    f.src = "./index.html?check=" + z.w + "x" + z.h;
    vp.append(f);
    box.append(cap, vp);
    row.append(box);
  });
</script>
</body>
</html>
