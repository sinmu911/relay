3. 바뀐 파일 내용
3-1. blog/write.html
기본 저장소 sinmu911/relay → sinmu911/relay-content, 토큰 안내도 "Only select repositories → relay-content"
브라우저에 옛 값(sinmu911/relay)이 남아 있으면 자동으로 relay-content로 교체
공개 저장소에는 저장 자체를 막음(설정 화면·저장 경로 양쪽) → 글쓰기 화면이 공개 저장소를 다시 오염시키지 못함
저장소를 못 볼 때(404) "저장소를 보지 못했어요 … 토큰의 저장소 접근 권한을 확인" 안내
라이브 확인: 설정 화면 저장소 칸 sinmu911/relay-content, 안내 문구 "글·사진은 비공개 저장소(relay-content)에만 저장됩니다."
확인한 동작(실제 브라우저, 가짜 토큰):
저장소에 sinmu911/relay를 넣고 저장 → "글은 비공개 저장소에만 저장해요. 저장소를 sinmu911/relay-content 로 바꿔 주세요." (요청 안 나감)
relay-content + 가짜 토큰 → "토큰이 틀렸어요." (오류 처리 정상)
