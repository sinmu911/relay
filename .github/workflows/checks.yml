4. 개인 식별값 검사 결과
공개 저장소(main)에서 mose_love, sinmu911@gmail.com, 세교동, 오산시, github_pat_…, ghp_…, PRIVATE KEY 문자열 0건. (해당 값들은 모두 _blog/ 안에 있었고 저장소 자체가 비공개로 옮겨졌습니다.)
일부러 남긴 것: 비공개 저장소의 _blog/uploader/config.example.json(blog_id: mose_love, neo_root: …GoogleDrive-sinmu911@gmail.com…)과 naver_editor.py의 같은 기본 경로. 이유 — ① 이미 비공개 저장소 안이라 공개 노출이 없고, ② setup_mac.sh install이 이 파일을 config.json으로 복사해 쓰기 때문에 값을 바꾸면 새로 설치할 때 업로더가 깨질 수 있으며, ③ 이 값들은 공개 저장소의 git 히스토리에 그대로 남아 있어서 비공개 사본만 고쳐도 노출은 줄지 않습니다. 원하시면 비공개 저장소 쪽도 일반 예시값으로 바꿔 드리겠습니다.
중계현황 PWA가 쓰는 값은 그대로: RELAY(중계 서버 …AKfycbykIRIG…/exec), DASH, VAPID_PUB, app.html의 https://sinmu911.github.io postMessage origin.
5. 남은 한 가지: checks.yml 교체 (GitHub 웹에서 붙여넣기)
지금 CI가 실패하는 이유(실측 로그):
text
python3: can't open file '/home/runner/work/relay/relay/playbooks/relay-shell-release/files/check.py': [Errno 2] No such file or directory
##[error]Process completed with exit code 2.
→ 옛 checks.yml이 없어진 playbooks/ 스크립트 5개를 실행하기 때문입니다.
Pickle의 GitHub 연결에는 workflows 쓰기 권한이 없어(앱 권한 목록에 없음) 제가 이 파일을 고칠 수 없습니다. 아래 주소에서 파일 전체를 지우고 아래 내용을 붙여넣은 뒤 Commit 하시면 됩니다.
https://github.com/sinmu911/relay/edit/main/.github/workflows/checks.yml
yaml
# 독립 검증자: PR·main 푸시마다 공개 저장소에 내부 문서·개인 식별값이 들어오지 않았는지 검사한다.
# (원고·내부 운영 문서 검사는 비공개 저장소 sinmu911/relay-content 쪽 일이다.)
name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 비공개 저장소로 빠진 폴더가 없는지
        run: |
          fail=0
          for d in _blog playbooks .claude; do
            if [ -e "$d" ]; then echo "::error::$d 는 비공개 저장소(sinmu911/relay-content)에만 있어야 합니다"; fail=1; fi
          done
          exit $fail
      - name: 사이트 필수 파일
        run: |
          fail=0
          for f in index.html app.html sw.js manifest.json blog/write.html \
                   icon-192.png icon-512.png icon-192-v2.png icon-512-v2.png icon-maskable-512-v2.png; do
            [ -f "$f" ] || { echo "::error::없음: $f"; fail=1; }
          done
          exit $fail
      - name: 개인 식별값·토큰 검사
        run: |
          if git grep -nIE 'mose_love|sinmu911@gmail\.com|세교동|오산시|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':(exclude).github/**' ; then
            echo "::error::개인 식별값이나 비밀값으로 보이는 문자열이 있습니다"
            exit 1
          fi
          echo "OK"
이 세 검사는 지금 main 트리에서 실제로 통과하는 것을 확인했습니다(깨끗한 클론에서 실행: 폴더 재유입 0, 필수 파일 전부 있음, 식별값 grep 0건). YAML 파싱도 확인했습니다.
6. 맥 업로더에서 바꿀 값
~/.naver-blog-uploader/config.json:
json
"repo": "sinmu911/relay-content",
"github_token": "<relay-content Contents Read/Write 토큰>"
토큰 새로 필요: https://github.com/settings/personal-access-tokens/new → Only select repositories → relay-content → Contents: Read and write (예전 토큰은 relay만 골라 만들었으면 비공개 저장소를 못 봅니다)
패치:
bash
  cp ~/.naver-blog-uploader/config.json ~/.naver-blog-uploader/config.json.bak
  python3 - <<'EOF'
  import json, pathlib
  p = pathlib.Path.home()/'.naver-blog-uploader/config.json'
  c = json.loads(p.read_text(encoding='utf-8'))
  c['repo'] = 'sinmu911/relay-content'
  p.write_text(json.dumps(c, ensure_ascii=False, indent=2), encoding='utf-8')
  print('repo =', c['repo'])
  EOF
코드 기본값도 바뀌었으니 bash ~/.naver-blog-uploader/app/setup_mac.sh update(설정·로그인·기록 유지)
blog_root(_blog), sources, neo_root, blog_id는 그대로
폰·PC 글쓰기 화면은 [설정]에서 토큰만 새로 넣으면 됩니다(저장소 값은 자동으로 relay-content로 바뀜)
7. 백엔드(Apps Script doPost) 권장 사항
프론트 방어는 우회 가능하므로 서버 쪽이 근본 대책입니다. Apps Script 웹앱의 doPost(e)에는 클라이언트 IP가 오지 않으므로(e.parameter·e.postData만) IP 기준 제한은 불가합니다.
1.
LockService 안에서 이메일별 쿨다운 — PropertiesService에 req:<email> = 마지막 요청 시각, 1시간 1회
2.
전체 일일 상한 — req_day:<yyyy-mm-dd> 카운터, 하루 N건 넘으면 조용히 무시(응답은 성공처럼)
3.
같은 이메일의 대기 건은 1건으로 합치기 — 승인 큐가 깨끗해짐
4.
Cloudflare Turnstile(무료) 토큰을 폼에 붙이고 UrlFetchApp으로 siteverify 검증
5.
승인 큐 화면에 요청 시각·횟수·같은 이메일 반복 여부 표시
8. 남은 위험: git 히스토리
main에서 지웠어도 공개 저장소의 과거 커밋(64개)과 옛 브랜치 3개에서는 _blog/·playbooks/·.claude/가 계속 열람됩니다.
ccr-0eea4943-j44c9h(31e26fa), claude/blog-auto-upload-system-anhpjr(9dff8ed), feat/blog-fusion-v2(1c8fe96) — 셋 다 이미 main에 병합됨
완전히 지우려면: git clone --mirror 백업 → git filter-repo --invert-paths --path _blog --path playbooks --path .claude → git push --force --all + 옛 브랜치 삭제. 되돌리기 어려운 작업이라 지시 없이 하지 않았습니다.
참고: 옛 브랜치 삭제만으로도 "지금 눈에 보이는" 노출은 크게 줄지만, 커밋 해시를 아는 사람은 여전히 열람 가능합니다.
