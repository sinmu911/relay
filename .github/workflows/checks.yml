허니팟 숨김 필드(#rq_web, 화면 밖·aria-hidden·tabindex=-1) — 채워져 있으면 보내지 않고 성공한 척
최소 체류시간 3초 — 화면이 뜨자마자 누르는 자동 제출 차단
연속 제출 30초 쿨다운, 같은 이메일 10분 중복 차단(localStorage rq_sent)
성공 시각·이메일 기록 → 새로고침해도 중복 요청이 안 나감
라이브 확인: 숨김 필드 존재·화면 밖(좌표 음수, opacity 0)·값 비어 있음, 제출 핸들러 연결됨, 이름만 넣고 제출 → "이메일을 확인해 주세요." (요청 안 나감)
