name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 비공개 저장소로 빠진 폴더가 없는지
        run: |
          fail=0
          for d in _blog playbooks .claude; do
            if [ -e "$d" ]; then echo "::error::$d 는 비공개 저장소(sinmu911/relay-content)에만 있어야 합니다"; fail=1; fi
          done
          exit $fail
      - name: 사이트 필수 파일
        run: |
          fail=0
          for f in index.html app.html sw.js manifest.json blog/write.html \
                   icon-192.png icon-512.png icon-192-v2.png icon-512-v2.png icon-maskable-512-v2.png; do
            [ -f "$f" ] || { echo "::error::없음: $f"; fail=1; }
          done
          exit $fail
      - name: 개인 식별값·토큰 검사
        run: |
          if git grep -nIE 'mose_love|sinmu911@gmail\.com|세교동|오산시|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':(exclude).github/**' ; then
            echo "::error::개인 식별값이나 비밀값으로 보이는 문자열이 있습니다"
            exit 1
          fi
          echo "OK"
