# 독립 검증자: PR마다 같은 검사를 GitHub에서 따로 돌린다 (실행 세션의 자기 보고와 분리).
# main 브랜치 보호 규칙에서 이 체크를 필수로 지정하면, 검사 실패 시 병합 버튼이 막힌다.
name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 playbooks/relay-shell-release/files/check.py
      - run: python3 playbooks/_tools/validate_playbooks.py
      - run: python3 playbooks/report-verified/files/test_claim_gate.py
      - run: python3 playbooks/_tools/test_skill_autouse.py
      - run: python3 playbooks/_tools/test_merge_gate.py
