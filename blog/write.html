<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>블로그 글쓰기</title>
<link rel="icon" href="../icon-192-v2.png">
<style>
:root{--bg:#EEF1F4;--surface:#FFFFFF;--ink:#16202B;--muted:#5B6776;--line:#D6DCE3;--accent:#5A7FB8;--accentInk:#FFFFFF;--ok:#4E9E77;--warn:#C98A2E;--bad:#C9605A;--chip:#E4E9EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--surface:#17222E;--ink:#E7ECF1;--muted:#93A1B1;--line:#263444;--accent:#8AABD6;--accentInk:#0B1833;--ok:#5DB58A;--warn:#D9A54A;--bad:#D9776F;--chip:#1F2C3A}}
:root[data-theme="dark"]{--bg:#0F1720;--surface:#17222E;--ink:#E7ECF1;--muted:#93A1B1;--line:#263444;--accent:#8AABD6;--accentInk:#0B1833;--ok:#5DB58A;--warn:#D9A54A;--bad:#D9776F;--chip:#1F2C3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink);text-decoration:none;display:inline-block}
.btn.hot{background:var(--accent);color:var(--accentInk)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:inherit;font:inherit;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:12px;color:var(--muted)}
.item>div{min-width:0}
.chip{flex:none;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.wait{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.empty{padding:18px 14px;color:var(--muted);font-size:13px}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 5px}
.inp{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit}
textarea.inp{min-height:46vh;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.btns{display:flex;gap:6px;flex:none}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.note{margin-top:14px;padding:11px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);font-size:13px}
.note.bad{border-left-color:var(--bad)}.note.warn{border-left-color:var(--warn)}.note.ok{border-left-color:var(--ok)}
.note a{color:var(--accent);word-break:break-all}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:13px;z-index:9;display:none}
ol.how{padding-left:20px;font-size:13px;margin:8px 0}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
<header><h1 id="hd">블로그 글쓰기</h1>
  <div class="btns"><button class="btn" id="b_back" type="button" hidden>목록</button><button class="btn" id="b_set" type="button">설정</button></div>
</header>

<section id="v_set" hidden>
  <div class="note">처음 한 번만: 글을 저장할 GitHub 열쇠(토큰)를 넣어 주세요. 이 폰·PC 브라우저에만 저장돼요.
    <ol class="how">
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기</a> 열기</li>
      <li>Repository access → <b>Only select repositories</b> → <b>relay</b></li>
      <li>Permissions → <b>Contents</b> → <b>Read and write</b> → Generate</li>
      <li>나온 <b>github_pat_…</b> 를 아래에 붙여넣기</li>
    </ol></div>
  <label class="f" for="s_token">GitHub 토큰</label><input class="inp" id="s_token" type="password" autocomplete="off" placeholder="github_pat_...">
  <div class="row"><div><label class="f" for="s_repo">저장소</label><input class="inp" id="s_repo" value="sinmu911/relay"></div>
    <div><label class="f" for="s_branch">브랜치</label><input class="inp" id="s_branch" value="main"></div></div>
  <div class="acts"><button class="btn hot" id="s_save" type="button">저장하고 확인</button></div>
  <div id="s_msg" class="hint"></div>
</section>

<section id="v_list" hidden>
  <div class="acts" style="justify-content:space-between;align-items:center">
    <span class="hint" style="margin:0">[올리기] 한 글은 맥이 5분 안에 네이버 블로그에 올려요.</span>
    <span class="btns"><button class="btn" id="b_reload" type="button">새로고침</button><button class="btn hot" id="b_new" type="button">새 글</button></span>
  </div>
  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
</section>

<section id="v_edit" hidden>
  <div id="e_note" class="note" hidden></div>
  <label class="f" for="e_title">제목</label><input class="inp" id="e_title" maxlength="100" placeholder="제목">
  <label class="f" for="e_body">본문</label>
  <textarea class="inp" id="e_body" placeholder="그냥 쓰면 돼요. 줄바꿈은 그대로 들어가요.&#10;&#10;**굵게**  # 큰 제목  - 목록"></textarea>
  <div class="acts" style="justify-content:flex-start;margin-top:8px">
    <button class="btn" id="e_img" type="button">사진 넣기</button><input type="file" id="e_file" accept="image/*" multiple hidden>
    <span id="e_imgmsg" class="hint" style="margin:0;align-self:center"></span>
  </div>
  <div class="row">
    <div><label class="f" for="e_tags">태그 <span style="font-weight:400">(쉼표로 구분)</span></label><input class="inp" id="e_tags" placeholder="화물, 운송"></div>
    <div><label class="f" for="e_cat">카테고리 <span style="font-weight:400">(비우면 기본)</span></label><input class="inp" id="e_cat" placeholder="블로그에 있는 이름 그대로"></div>
  </div>
  <label class="f" for="e_when">예약 <span style="font-weight:400">(비우면 바로)</span></label><input class="inp" id="e_when" type="datetime-local">
  <div class="acts" id="e_acts">
    <button class="btn" id="e_draft" type="button">임시저장</button>
    <button class="btn hot" id="e_go" type="button">올리기</button>
  </div>
</section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// 블로그 글쓰기(폰·PC). 글은 GitHub 저장소 _blog/posts 에 .md 로 저장 → 맥의 업로더가 네이버에 올림.
// 저장 형식은 _blog/uploader/blogpost.py 와 같아야 한다(머리말 key: value).
const ROOT = '_blog', POSTS = ROOT + '/posts', IMAGES = ROOT + '/images', STATE = ROOT + '/state.json';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let cfg = store.get('blog_cfg', null);
let files = [], state = {posts: {}}, cache = {}, cur = null;   // cur: 편집 중인 글 {path, sha, rec}

function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4000); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function show(v) { for (const id of ['v_set', 'v_list', 'v_edit']) $(id).hidden = id !== v; $('b_back').hidden = v === 'v_list'; window.scrollTo(0, 0); }
function pad(n) { return String(n).padStart(2, '0'); }
function stamp(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()); }
function oneLine(s) { return String(s || '').replace(/[\r\n]+/g, ' ').trim(); }
function b64enc(str) { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(b64) { const bin = atob(String(b64).replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function tagsOf(s) { const out = []; for (let t of String(s || '').split(/[,，]/)) { t = t.trim().replace(/^#+/, '').trim(); if (t && !out.includes(t)) out.push(t); } return out; }

async function gh(method, path, body) {
  const url = 'https://api.github.com/repos/' + cfg.repo + '/contents/' + path.split('/').map(encodeURIComponent).join('/') + (method === 'GET' ? '?ref=' + encodeURIComponent(cfg.branch) : '');
  let r;
  try {
    r = await fetch(url, {method, cache: 'no-store', headers: {'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json'}, body: body ? JSON.stringify(body) : undefined});
  } catch (e) { throw new Error('인터넷 연결을 확인해 주세요'); }
  if (r.status === 404 && method === 'GET') return null;
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error('토큰이 틀렸거나 만료됐어요 → [설정]');
  if (r.status === 409 || (r.status === 422 && /sha/i.test(j.message || ''))) throw new Error('다른 곳에서 먼저 바뀌었어요. 목록을 새로고침한 뒤 다시 해 주세요.');
  if (!r.ok) throw new Error('GitHub 오류 ' + r.status + (j.message ? ': ' + j.message : ''));
  return j;
}
async function put(path, contentB64, sha, message) {
  const body = {message, content: contentB64, branch: cfg.branch};
  if (sha) body.sha = sha;
  return gh('PUT', path, body);
}

// ── 글 파일 형식 (blogpost.py 와 같은 규칙) ──
function parseFile(text) {
  const lines = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  const meta = {};
  if (lines[0].trim() !== '---') return {meta, body: lines.join('\n')};
  let end = 1;
  while (end < lines.length && lines[end].trim() !== '---') end++;
  for (const line of lines.slice(1, end)) {
    if (!line.trim() || line.trim().startsWith('#')) continue;
    const i = line.indexOf(':'); if (i < 0) continue;
    meta[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
  }
  return {meta, body: lines.slice(end + 1).join('\n').replace(/^\n+|\n+$/g, '')};
}
function buildFile(f) {
  const L = ['---', 'title: ' + oneLine(f.title), 'status: ' + f.status];
  const tags = tagsOf(f.tags); if (tags.length) L.push('tags: ' + tags.join(', '));
  if (oneLine(f.category)) L.push('category: ' + oneLine(f.category));
  if (f.publish_at) L.push('publish_at: ' + f.publish_at);
  if (f.retry) L.push('retry: ' + f.retry);
  L.push('---');
  return L.join('\n') + '\n' + String(f.body || '').replace(/\r\n?/g, '\n').replace(/^\n+|\s+$/g, '') + '\n';
}
function whenText(v) { const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(v || ''); return m ? (+m[2]) + '/' + (+m[3]) + ' ' + m[4] + ':' + m[5] : ''; }
function whenDate(v) { const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(v || ''); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }

// ── 상태 표시 ──
const LOCKED = ['published', 'publishing', 'needs_check'];
function statusOf(file, meta) {
  const rec = state.posts[file.path];
  if (rec && (LOCKED.includes(rec.status) || rec.blob_sha === file.sha)) {
    if (rec.status === 'published') return {chip: '올라감', cls: 'ok', rec};
    if (rec.status === 'publishing') return {chip: '올리는 중', cls: 'wait', rec};
    if (rec.status === 'needs_check') return {chip: '확인 필요', cls: 'warn', rec};
    if (rec.status === 'duplicate') return {chip: '같은 제목 있음', cls: 'warn', rec};
    if (rec.status === 'invalid') return {chip: '글 형식 오류', cls: 'bad', rec};
    if (rec.status === 'failed') return {chip: '실패 ' + (rec.attempts || 1) + '회', cls: 'bad', rec};
  }
  if ((meta.status || '').toLowerCase() !== 'ready') return {chip: '임시저장', cls: '', rec};
  const at = whenDate(meta.publish_at);
  if (at && at > new Date()) return {chip: '예약 ' + whenText(meta.publish_at), cls: 'wait', rec};
  return {chip: '올라갈 차례', cls: 'wait', rec};
}

async function loadList() {
  $('list').replaceChildren(el('div', 'empty', '불러오는 중…'));
  try {
    const [dir, st] = await Promise.all([gh('GET', POSTS), gh('GET', STATE)]);
    files = (Array.isArray(dir) ? dir : []).filter(f => f.type === 'file' && /\.md$/.test(f.name) && !/^[_.]/.test(f.name)).sort((a, b) => b.name.localeCompare(a.name));
    try { state = st ? JSON.parse(b64dec(st.content)) : {posts: {}}; } catch (e) { state = {posts: {}}; }
    state.posts = state.posts || {};
    cache = store.get('blog_cache', {});
    await Promise.all(files.map(async f => {
      if (cache[f.sha]) return;
      const j = await gh('GET', f.path);
      if (j) cache[f.sha] = b64dec(j.content);
    }));
    const keep = {}; for (const f of files) if (cache[f.sha]) keep[f.sha] = cache[f.sha];
    cache = keep; store.set('blog_cache', cache);
    renderList();
  } catch (e) { $('list').replaceChildren(el('div', 'empty', '불러오지 못했어요: ' + e.message)); }
}
function renderList() {
  if (!files.length) { $('list').replaceChildren(el('div', 'empty', '아직 글이 없어요. [새 글]을 눌러 써 보세요.')); return; }
  $('list').replaceChildren(...files.map(f => {
    const {meta} = parseFile(cache[f.sha] || '');
    const s = statusOf(f, meta);
    const b = el('button', 'item'); b.type = 'button';
    const left = el('div');
    left.append(el('div', 't', meta.title || '(제목 없음)'), el('div', 'd', f.name.replace(/\.md$/, '').replace(/^(\d{4}-\d\d-\d\d)-(\d\d)(\d\d)(\d\d)$/, '$1 $2:$3')));
    b.append(left, el('span', 'chip ' + s.cls, s.chip));
    b.onclick = () => openEditor(f);
    return b;
  }));
}

// ── 편집 ──
function fill(v) {
  $('e_title').value = v.title || ''; $('e_body').value = v.body || ''; $('e_tags').value = v.tags || '';
  $('e_cat').value = v.category || ''; $('e_when').value = (v.publish_at || '').replace(' ', 'T').slice(0, 16);
}
function formValues() {
  return {title: $('e_title').value, body: $('e_body').value, tags: $('e_tags').value, category: $('e_cat').value,
          publish_at: $('e_when').value ? $('e_when').value.replace('T', ' ') : ''};
}
function setReadonly(ro) {
  for (const id of ['e_title', 'e_body', 'e_tags', 'e_cat', 'e_when']) $(id).readOnly = ro;
  $('e_img').disabled = ro; $('e_acts').hidden = ro;
}
function note(cls, parts) {
  const n = $('e_note'); n.className = 'note ' + cls; n.replaceChildren(...parts); n.hidden = false;
}
function openEditor(f) {
  $('e_note').hidden = true; setReadonly(false); $('e_imgmsg').textContent = '';
  if (!f) {
    cur = {path: null, sha: null, rec: null, retry: ''};
    const d = store.get('blog_draft', null);
    fill(d && !d.path ? d.v : {});
    if (d && !d.path) toast('쓰던 글을 불러왔어요.');
    $('hd').textContent = '새 글';
  } else {
    const {meta, body} = parseFile(cache[f.sha] || '');
    const s = statusOf(f, meta);
    cur = {path: f.path, sha: f.sha, rec: s.rec, retry: meta.retry || ''};
    const d = store.get('blog_draft', null);
    if (d && d.path === f.path && d.sha === f.sha) { fill(d.v); toast('고치던 내용을 불러왔어요.'); }
    else fill({title: meta.title, body, tags: meta.tags, category: meta.category, publish_at: meta.publish_at});
    $('hd').textContent = '글 고치기';
    const rec = s.rec || {};
    if (s.chip === '올라감') {
      const a = el('a', null, rec.url || ''); if (/^https:\/\/blog\.naver\.com\//.test(rec.url || '')) { a.href = rec.url; a.target = '_blank'; a.rel = 'noopener'; }
      note('ok', [el('b', null, '네이버에 올라간 글이에요. '), a, el('div', 'hint', '여기서 고쳐도 네이버엔 반영되지 않아요. 고칠 땐 네이버 블로그에서 직접 고쳐 주세요.')]);
      setReadonly(true);
    } else if (s.chip === '올리는 중') {
      note('', [el('span', null, '맥이 지금 올리고 있어요. 잠시 뒤 새로고침해 주세요.')]); setReadonly(true);
    } else if (['확인 필요', '같은 제목 있음'].includes(s.chip) || s.cls === 'bad') {
      const parts = [el('b', null, s.chip + ': '), el('span', null, rec.error || '')];
      if (s.chip === '확인 필요') parts.push(el('div', 'hint', '네이버 블로그에 이미 올라가 있으면 그대로 두세요. 안 올라갔으면 아래 [다시 올리기].'));
      if (s.chip === '같은 제목 있음') parts.push(el('div', 'hint', '제목을 조금 바꿔 [올리기] 하거나, 같은 제목으로 또 올리려면 [다시 올리기].'));
      if (s.chip === '글 형식 오류') parts.push(el('div', 'hint', '고친 뒤 [올리기] 하면 다시 시도해요.'));
      if (s.chip !== '글 형식 오류') {
        const rb = el('button', 'btn hot', '다시 올리기'); rb.type = 'button'; rb.style.marginTop = '8px';
        rb.onclick = () => save('ready', true);
        parts.push(el('div', null), rb);
      }
      note(s.cls === 'bad' ? 'bad' : 'warn', parts);
    }
  }
  show('v_edit');
}
function autosave() { if (cur && !$('e_title').readOnly) store.set('blog_draft', {path: cur.path, sha: cur.sha, v: formValues()}); }
let busy = false;
async function save(status, retry) {
  if (busy) return;
  const v = formValues();
  if (status === 'ready') {
    if (!oneLine(v.title)) { toast('제목을 써 주세요.'); return; }
    if (!v.body.trim()) { toast('본문을 써 주세요.'); return; }
    if (tagsOf(v.tags).length > 30) { toast('태그는 30개까지예요.'); return; }
    const at = whenDate(v.publish_at);
    const msg = retry ? '네이버에 다시 올릴까요?' : at && at > new Date() ? whenText(v.publish_at) + '에 네이버에 올릴까요?' : '네이버 블로그에 올릴까요? (맥이 5분 안에 올려요)';
    if (!confirm(msg)) return;
  }
  busy = true; $('e_draft').disabled = $('e_go').disabled = true;
  try {
    const path = cur.path || POSTS + '/' + stamp() + '.md';
    const pad2 = n => String(n).padStart(2, '0'), d = new Date();
    const retryVal = retry ? d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) : cur.retry;
    const text = buildFile(Object.assign({}, v, {status, retry: retryVal}));
    await put(path, b64enc(text), cur.sha, (status === 'ready' ? '블로그 올리기: ' : '블로그 임시저장: ') + oneLine(v.title).slice(0, 60));
    store.del('blog_draft');
    toast(status === 'ready' ? '저장했어요. 맥이 곧 올려요.' : '임시저장했어요.');
    show('v_list'); $('hd').textContent = '블로그 글쓰기'; await loadList();
  } catch (e) { toast(e.message); }
  finally { busy = false; $('e_draft').disabled = $('e_go').disabled = false; }
}

// ── 사진: 폰 사진은 커서 줄이고(긴 쪽 1600px) jpg 로 바꿔 올린다 ──
function loadImg(file) { return new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => ok(im); im.onerror = () => { URL.revokeObjectURL(u); no(new Error('사진을 못 읽어요: ' + file.name)); }; im.src = u; }); }
async function toJpegB64(file) {
  const im = await loadImg(file);
  const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
  URL.revokeObjectURL(im.src);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
function insertAtCursor(t) {
  const ta = $('e_body'), s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const ins = (before && !before.endsWith('\n') ? '\n' : '') + t + '\n';
  ta.value = before + ins + after; ta.selectionStart = ta.selectionEnd = (before + ins).length; autosave();
}
$('e_file').onchange = async () => {
  const list = [...$('e_file').files]; $('e_file').value = '';
  if (!list.length) return;
  $('e_img').disabled = true;
  try {
    const base = stamp().replace(/-(\d{6})$/, '_$1');
    for (let i = 0; i < list.length; i++) {
      $('e_imgmsg').textContent = '사진 올리는 중… (' + (i + 1) + '/' + list.length + ')';
      const name = base + '-' + (i + 1) + '-' + Math.random().toString(36).slice(2, 6) + '.jpg';
      await put(IMAGES + '/' + name, await toJpegB64(list[i]), null, '블로그 사진');
      insertAtCursor('![](images/' + name + ')');
    }
    $('e_imgmsg').textContent = '사진 ' + list.length + '장 넣었어요.';
  } catch (e) { $('e_imgmsg').textContent = ''; toast(e.message); }
  finally { $('e_img').disabled = false; }
};

// ── 설정 ──
function openSettings() {
  if (cfg) { $('s_token').value = cfg.token; $('s_repo').value = cfg.repo; $('s_branch').value = cfg.branch; }
  $('s_msg').textContent = ''; $('hd').textContent = '설정'; show('v_set');
}
$('s_save').onclick = async () => {
  const c = {token: $('s_token').value.trim(), repo: $('s_repo').value.trim(), branch: $('s_branch').value.trim() || 'main'};
  if (!/^(github_pat_|ghp_)\w{20,}$/.test(c.token)) { $('s_msg').textContent = '토큰은 github_pat_ 로 시작해요.'; return; }
  if (!/^[\w.-]+\/[\w.-]+$/.test(c.repo)) { $('s_msg').textContent = '저장소는 주인/이름 형식이에요.'; return; }
  $('s_msg').textContent = '확인 중…';
  try {
    const r = await fetch('https://api.github.com/repos/' + c.repo, {cache: 'no-store', headers: {'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json'}});
    if (!r.ok) throw new Error(r.status === 401 ? '토큰이 틀렸어요.' : '저장소에 접근할 수 없어요(' + r.status + '). 토큰의 저장소 선택을 확인해 주세요.');
    cfg = c; store.set('blog_cfg', cfg);
    toast('연결됐어요.'); $('hd').textContent = '블로그 글쓰기'; show('v_list'); loadList();
  } catch (e) { $('s_msg').textContent = e.message || '인터넷 연결을 확인해 주세요.'; }
};

$('b_set').onclick = openSettings;
$('b_back').onclick = () => { if (!cfg) return; $('hd').textContent = '블로그 글쓰기'; show('v_list'); renderList(); };
$('b_reload').onclick = loadList;
$('b_new').onclick = () => openEditor(null);
$('e_img').onclick = () => $('e_file').click();
$('e_draft').onclick = () => save('draft');
$('e_go').onclick = () => save('ready');
for (const id of ['e_title', 'e_body', 'e_tags', 'e_cat', 'e_when']) $(id).addEventListener('input', autosave);

if (cfg && cfg.token) { show('v_list'); loadList(); } else openSettings();
</script>
